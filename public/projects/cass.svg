<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-cass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0d152a" />
      <stop offset="100%" stop-color="#060a14" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="neural-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121e38" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>
    <pattern id="dot-grid-blue" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.16" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-cass)" />
  <rect width="1200" height="675" fill="url(#dot-grid-blue)" />
  <circle cx="920" cy="220" r="320" fill="url(#blue-glow)" />

  <!-- macOS Window Frame -->
  <g transform="translate(100, 110)">
    <rect width="1000" height="480" rx="16" fill="#0d172e" stroke="#1d3058" stroke-width="1.5" />
    <rect width="1000" height="44" rx="16" fill="#142140" />
    <circle cx="28" cy="22" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="44" cy="22" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="100" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">cass — sme artificial intelligence &amp; predictive engine · v2.0.0</text>

    <!-- Info Column -->
    <g transform="translate(48, 70)">
      <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">CASS</text>
      <text x="0" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AI AUTOMATION &amp; PREDICTIVE ANALYTICS</text>
      <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Tailored machine learning models and NLP workflows designed</text>
      <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">to automate SME operational processes and deliver predictive insights.</text>

      <!-- Token Chips -->
      <g transform="translate(0, 160)">
        <rect width="68" height="26" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
        <text x="34" y="17" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Python</text>

        <rect x="78" width="98" height="26" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" />
        <text x="127" y="17" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Deep Learning</text>

        <rect x="186" width="56" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="214" y="17" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">NLP</text>

        <rect x="252" width="76" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
        <text x="290" y="17" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">FastAPI</text>

        <rect x="338" width="68" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
        <text x="372" y="17" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Docker</text>
      </g>

      <!-- Python ML Pipeline Snippet -->
      <g transform="translate(0, 210)">
        <rect width="410" height="155" rx="8" fill="#091122" stroke="#1c2d52" stroke-width="1" />
        <text x="16" y="26" fill="#64748b" font-family="monospace" font-size="10"># cass_inference_pipeline.py · v2.0</text>
        <text x="16" y="48" fill="#38bdf8" font-family="monospace" font-size="11">from <tspan fill="#a5b4fc">cass_core</tspan> import <tspan fill="#e2e8f0">InferenceEngine</tspan></text>
        <text x="16" y="68" fill="#e2e8f0" font-family="monospace" font-size="11">model = InferenceEngine(weights=<tspan fill="#fbbf24">&apos;sme-opt-v2.pt&apos;</tspan>)</text>
        <text x="16" y="88" fill="#38bdf8" font-family="monospace" font-size="11">prediction = model.predict(telemetry_stream)</text>
        <text x="16" y="112" fill="#34d399" font-family="monospace" font-size="11">accuracy: 98.4% | f1_score: 0.978 | latency: 3.2ms</text>
        <text x="16" y="132" fill="#64748b" font-family="monospace" font-size="10">✓ Automated classification &amp; anomaly detection active</text>
      </g>
    </g>

    <!-- Right Side: Neural Network Graph & Metrics Visualizer -->
    <g transform="translate(520, 60)">
      <rect width="430" height="375" rx="12" fill="url(#neural-grad)" stroke="#1f3663" stroke-width="1.5" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))" />
      
      <!-- Top Metric Bar -->
      <g transform="translate(24, 24)">
        <rect width="382" height="42" rx="6" fill="#0b1428" stroke="#1d3056" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#38bdf8" />
        <text x="34" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">NEURAL PREDICTION PIPELINE</text>
        <rect x="270" y="10" width="98" height="22" rx="4" fill="#0284c7" fill-opacity="0.18" />
        <text x="319" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">INFERENCE OK</text>

        <!-- Connected Neural Graph -->
        <g transform="translate(0, 58)">
          <rect width="382" height="175" rx="8" fill="#080e1c" stroke="#152342" stroke-width="1" />
          
          <!-- Connection Lines with subtle glows -->
          <!-- Input to Hidden 1 -->
          <line x1="45" y1="40" x2="135" y2="30" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
          <line x1="45" y1="40" x2="135" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
          <line x1="45" y1="40" x2="135" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
          
          <line x1="45" y1="88" x2="135" y2="30" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
          <line x1="45" y1="88" x2="135" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
          <line x1="45" y1="88" x2="135" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
          <line x1="45" y1="88" x2="135" y2="145" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

          <line x1="45" y1="135" x2="135" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
          <line x1="45" y1="135" x2="135" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
          <line x1="45" y1="135" x2="135" y2="145" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />

          <!-- Hidden 1 to Hidden 2 -->
          <line x1="135" y1="30" x2="235" y2="45" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />
          <line x1="135" y1="70" x2="235" y2="45" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" />
          <line x1="135" y1="70" x2="235" y2="90" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7" />
          <line x1="135" y1="110" x2="235" y2="90" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" />
          <line x1="135" y1="110" x2="235" y2="135" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />
          <line x1="135" y1="145" x2="235" y2="135" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />

          <!-- Hidden 2 to Output -->
          <line x1="235" y1="45" x2="335" y2="65" stroke="#34d399" stroke-width="2" stroke-opacity="0.7" />
          <line x1="235" y1="90" x2="335" y2="65" stroke="#34d399" stroke-width="2" stroke-opacity="0.8" />
          <line x1="235" y1="90" x2="335" y2="115" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" />
          <line x1="235" y1="135" x2="335" y2="115" stroke="#34d399" stroke-width="2" stroke-opacity="0.7" />

          <!-- Input Layer Nodes -->
          <circle cx="45" cy="40" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
          <circle cx="45" cy="88" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
          <circle cx="45" cy="135" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />

          <!-- Hidden Layer 1 Nodes -->
          <circle cx="135" cy="30" r="9" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" />
          <circle cx="135" cy="70" r="9" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" />
          <circle cx="135" cy="110" r="9" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" />
          <circle cx="135" cy="145" r="9" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" />

          <!-- Hidden Layer 2 Nodes -->
          <circle cx="235" cy="45" r="9" fill="#4f46e5" stroke="#818cf8" stroke-width="2" />
          <circle cx="235" cy="90" r="9" fill="#4f46e5" stroke="#818cf8" stroke-width="2" />
          <circle cx="235" cy="135" r="9" fill="#4f46e5" stroke="#818cf8" stroke-width="2" />

          <!-- Output Layer Nodes (Glow) -->
          <circle cx="335" cy="65" r="11" fill="#059669" stroke="#34d399" stroke-width="2.5" />
          <circle cx="335" cy="115" r="11" fill="#059669" stroke="#34d399" stroke-width="2.5" />
        </g>

        <!-- Bottom Performance Metrics -->
        <g transform="translate(0, 248)">
          <rect width="120" height="66" rx="6" fill="#0b1428" stroke="#1a2b4e" stroke-width="1" />
          <text x="14" y="22" fill="#94a3b8" font-family="monospace" font-size="10">PRECISION</text>
          <text x="14" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">99.1%</text>

          <rect x="131" width="120" height="66" rx="6" fill="#0b1428" stroke="#1a2b4e" stroke-width="1" />
          <text x="145" y="22" fill="#94a3b8" font-family="monospace" font-size="10">THROUGHPUT</text>
          <text x="145" y="46" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">1.4k req/s</text>

          <rect x="262" width="120" height="66" rx="6" fill="#0b1428" stroke="#1a2b4e" stroke-width="1" />
          <text x="276" y="22" fill="#94a3b8" font-family="monospace" font-size="10">REDUCTION</text>
          <text x="276" y="46" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">-64% OpEx</text>
        </g>
      </g>
    </g>
  </g>
</svg>
