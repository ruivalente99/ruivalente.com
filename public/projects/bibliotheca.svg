<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-bib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#151d2d" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#253248" stroke-width="1" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg-bib)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <circle cx="950" cy="180" r="320" fill="url(#amber-glow)" />

  <!-- Code / IDE Wireframe Preview -->
  <g transform="translate(100, 110)">
    <!-- Window Frame -->
    <rect width="1000" height="480" rx="16" fill="#131b2e" stroke="#2b3b55" stroke-width="1.5" />
    <!-- Header Bar -->
    <rect width="1000" height="44" rx="16" fill="#182238" />
    <circle cx="28" cy="22" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="44" cy="22" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="100" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">@ruivalente99/bibliotheca — v0.8.0</text>

    <!-- Split Left: Component Cards -->
    <g transform="translate(36, 70)">
      <rect width="400" height="360" rx="12" fill="url(#card-grad)" stroke="#2d3f5e" stroke-width="1" />
      <text x="24" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Bibliotheca</text>
      <text x="24" y="68" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1.5">Offline-First UI Library &amp; Editor</text>
      <text x="24" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" width="350">Modular, business-agnostic component architecture</text>
      <text x="24" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">with strict token discipline and 7 signature themes.</text>

      <!-- Token Chips -->
      <g transform="translate(24, 160)">
        <rect width="84" height="26" rx="6" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1" />
        <text x="42" y="17" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">React 19</text>

        <rect x="94" width="94" height="26" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
        <text x="141" y="17" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Tailwind v4</text>

        <rect x="198" width="68" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="232" y="17" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Bun</text>

        <rect x="276" width="76" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
        <text x="314" y="17" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Storybook</text>
      </g>

      <!-- Component Preview Blocks -->
      <g transform="translate(24, 215)">
        <rect width="352" height="42" rx="8" fill="#182236" stroke="#2c3a52" stroke-width="1" />
        <rect x="12" y="12" width="18" height="18" rx="4" fill="#d97706" />
        <text x="40" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">SplitEditorLayout</text>
        <text x="290" y="25" fill="#64748b" font-family="monospace" font-size="11">0.8.0</text>

        <rect y="54" width="352" height="42" rx="8" fill="#182236" stroke="#2c3a52" stroke-width="1" />
        <rect x="12" y="66" width="18" height="18" rx="4" fill="#0f766e" />
        <text x="40" y="79" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">PreviewViewport (A4 Pan/Zoom)</text>
        <text x="290" y="79" fill="#64748b" font-family="monospace" font-size="11">Core</text>
      </g>
    </g>

    <!-- Split Right: A4 Document Sheet Render -->
    <g transform="translate(470, 70)">
      <!-- A4 Canvas Sheet -->
      <rect width="490" height="360" rx="10" fill="#ffffff" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
      <!-- Sheet Header Accent -->
      <rect width="490" height="8" rx="4" fill="#d97706" />
      <rect x="36" y="32" width="160" height="18" rx="4" fill="#0f172a" />
      <rect x="36" y="58" width="220" height="8" rx="2" fill="#94a3b8" />

      <!-- Document Mock Columns -->
      <g transform="translate(36, 85)">
        <!-- Left Sidebar Column -->
        <rect width="130" height="230" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="65" cy="45" r="24" fill="#e2e8f0" />
        <rect x="25" y="85" width="80" height="6" rx="2" fill="#cbd5e1" />
        <rect x="25" y="100" width="60" height="5" rx="2" fill="#e2e8f0" />
        <rect x="25" y="125" width="80" height="18" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
        <rect x="25" y="155" width="80" height="18" rx="4" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1" />

        <!-- Right Main Column -->
        <g transform="translate(150, 0)">
          <rect width="265" height="45" rx="6" fill="#f1f5f9" />
          <rect x="16" y="12" width="120" height="8" rx="2" fill="#334155" />
          <rect x="16" y="26" width="180" height="6" rx="2" fill="#94a3b8" />

          <rect y="55" width="265" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
          <rect x="16" y="67" width="90" height="7" rx="2" fill="#0f766e" />
          <rect x="16" y="82" width="220" height="5" rx="2" fill="#cbd5e1" />
          <rect x="16" y="93" width="190" height="5" rx="2" fill="#cbd5e1" />
          <rect x="16" y="104" width="160" height="5" rx="2" fill="#cbd5e1" />

          <rect y="140" width="265" height="90" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
          <rect x="16" y="152" width="100" height="7" rx="2" fill="#d97706" />
          <rect x="16" y="167" width="210" height="5" rx="2" fill="#cbd5e1" />
          <rect x="16" y="178" width="180" height="5" rx="2" fill="#cbd5e1" />
          <rect x="16" y="189" width="195" height="5" rx="2" fill="#cbd5e1" />
        </g>
      </g>
    </g>
  </g>
</svg>
