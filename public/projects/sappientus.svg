<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-sappientus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05140f" />
      <stop offset="50%" stop-color="#0a2119" />
      <stop offset="100%" stop-color="#040e0b" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cert-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112920" />
      <stop offset="100%" stop-color="#0a1a14" />
    </linearGradient>
    <pattern id="dot-grid-emerald" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#10b981" fill-opacity="0.16" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-sappientus)" />
  <rect width="1200" height="675" fill="url(#dot-grid-emerald)" />
  <circle cx="920" cy="220" r="320" fill="url(#emerald-glow)" />

  <!-- macOS Window Frame -->
  <g transform="translate(100, 110)">
    <rect width="1000" height="480" rx="16" fill="#091b14" stroke="#133d2e" stroke-width="1.5" />
    <rect width="1000" height="44" rx="16" fill="#0e261d" />
    <circle cx="28" cy="22" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="44" cy="22" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="100" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">sappientus — intelligent document &amp; certificate engine · v1.2.0</text>

    <!-- Info Column -->
    <g transform="translate(48, 70)">
      <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Sappientus</text>
      <text x="0" y="66" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DOCUMENT &amp; CERTIFICATE WORKFLOW</text>
      <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Digital document workflow, cryptographic certificate issuance,</text>
      <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">and automated delivery with LibSQL edge storage and Better-Auth.</text>

      <!-- Token Chips -->
      <g transform="translate(0, 160)">
        <rect width="84" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="42" y="17" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Next.js 16</text>

        <rect x="94" width="76" height="26" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
        <text x="132" y="17" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">React 19</text>

        <rect x="180" width="72" height="26" rx="6" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1" />
        <text x="216" y="17" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">LibSQL</text>

        <rect x="262" width="70" height="26" rx="6" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1" />
        <text x="297" y="17" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Kysely</text>

        <rect x="342" width="88" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
        <text x="386" y="17" fill="#c084fc" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Better-Auth</text>
      </g>

      <!-- Database Query Pipeline Preview -->
      <g transform="translate(0, 210)">
        <rect width="410" height="155" rx="8" fill="#061610" stroke="#133d2e" stroke-width="1" />
        <text x="16" y="26" fill="#64748b" font-family="monospace" font-size="10">// LibSQL Edge Verification Query</text>
        <text x="16" y="48" fill="#10b981" font-family="monospace" font-size="11">const cert = await <tspan fill="#38bdf8">db</tspan></text>
        <text x="16" y="68" fill="#34d399" font-family="monospace" font-size="11">  .selectFrom(<tspan fill="#fbbf24">&apos;certificates&apos;</tspan>)</text>
        <text x="16" y="88" fill="#34d399" font-family="monospace" font-size="11">  .where(<tspan fill="#fbbf24">&apos;hash&apos;</tspan>, <tspan fill="#fbbf24">&apos;=&apos;</tspan>, certHash)</text>
        <text x="16" y="108" fill="#34d399" font-family="monospace" font-size="11">  .selectAll().executeTakeFirstOrThrow();</text>
        <text x="16" y="132" fill="#64748b" font-family="monospace" font-size="10">✓ Cryptographic signature verified · 1.4ms edge latency</text>
      </g>
    </g>

    <!-- Right Side: Certificate & Document Visualizer -->
    <g transform="translate(520, 60)">
      <rect width="430" height="375" rx="12" fill="url(#cert-grad)" stroke="#1a4736" stroke-width="1.5" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))" />
      
      <!-- Certificate Header -->
      <g transform="translate(28, 28)">
        <!-- Verified Ribbon / Shield -->
        <rect width="374" height="42" rx="6" fill="#092017" stroke="#1a503a" stroke-width="1" />
        <circle cx="24" cy="21" r="10" fill="#10b981" />
        <path d="M 19 21 L 22 24 L 29 17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="44" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">VERIFIED CREDENTIAL ARCHIVE</text>
        <rect x="270" y="11" width="90" height="20" rx="4" fill="#10b981" fill-opacity="0.18" />
        <text x="315" y="25" fill="#34d399" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">AUTHENTIC</text>

        <!-- Certificate Body -->
        <g transform="translate(0, 60)">
          <rect width="374" height="215" rx="8" fill="#061610" stroke="#163e2e" stroke-width="1" />
          
          <!-- Decorative Corner Accents -->
          <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#10b981" stroke-width="1.5" />
          <path d="M 362 24 L 362 12 L 350 12" fill="none" stroke="#10b981" stroke-width="1.5" />
          <path d="M 12 191 L 12 203 L 24 203" fill="none" stroke="#10b981" stroke-width="1.5" />
          <path d="M 362 191 L 362 203 L 350 203" fill="none" stroke="#10b981" stroke-width="1.5" />

          <text x="187" y="38" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
          <text x="187" y="68" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Frontend Engineering Excellence</text>
          <text x="187" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Awarded to <tspan fill="#34d399" font-weight="600">Rui Valente</tspan></text>
          
          <line x1="40" y1="110" x2="334" y2="110" stroke="#1e4d3a" stroke-width="1" />

          <!-- Details Grid -->
          <g transform="translate(40, 126)">
            <text x="0" y="12" fill="#64748b" font-family="monospace" font-size="10">ISSUED AT</text>
            <text x="0" y="28" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="600">2026-03-15</text>

            <text x="120" y="12" fill="#64748b" font-family="monospace" font-size="10">STORAGE NODE</text>
            <text x="120" y="28" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="600">Turso / LibSQL</text>

            <text x="230" y="12" fill="#64748b" font-family="monospace" font-size="10">SIGNATURE</text>
            <text x="230" y="28" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">ED25519-OK</text>
          </g>

          <g transform="translate(40, 172)">
            <rect width="294" height="24" rx="4" fill="#0e2a1f" />
            <text x="12" y="16" fill="#6ee7b7" font-family="monospace" font-size="10">HASH: 8f9b2c4e1a0d3f8a7e6b5c4d3e2f1a0b</text>
          </g>
        </g>

        <!-- Footer Audit Indicator -->
        <g transform="translate(0, 290)">
          <rect width="374" height="28" rx="6" fill="#0d261c" />
          <circle cx="16" cy="14" r="4" fill="#34d399" />
          <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated PDF generator &amp; verified download ready</text>
        </g>
      </g>
    </g>
  </g>
</svg>
