<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-img" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sticker-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-img)" />
  <rect width="1200" height="675" fill="url(#dot-grid)" />
  <circle cx="850" cy="250" r="300" fill="url(#cyan-glow)" />

  <g transform="translate(100, 110)">
    <rect width="1000" height="480" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1000" height="44" rx="16" fill="#1e293b" />
    <circle cx="28" cy="22" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="44" cy="22" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="100" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">Imaguncula — SVG &amp; Sticker Asset Pipeline</text>

    <!-- Info Column -->
    <g transform="translate(48, 80)">
      <text x="0" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Imaguncula</text>
      <text x="0" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="1.5">Offline-First SVG Studio &amp; Asset Engine</text>
      <text x="0" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Real-time vector sticker outline dilation,</text>
      <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">SVG manipulation, and multi-resolution batch asset bundles.</text>

      <g transform="translate(0, 180)">
        <rect width="84" height="28" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
        <text x="42" y="18" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Next.js 15</text>

        <rect x="94" width="76" height="28" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" />
        <text x="132" y="18" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">React 19</text>

        <rect x="180" width="80" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="220" y="18" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Vector SVG</text>

        <rect x="270" width="68" height="28" rx="6" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1" />
        <text x="304" y="18" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">JSZip</text>
      </g>
    </g>

    <!-- Visual Canvas Mockup -->
    <g transform="translate(560, 80)">
      <rect width="390" height="340" rx="12" fill="#131d33" stroke="#253556" stroke-width="1.5" />
      <!-- Sticker Preview with Glow -->
      <circle cx="195" cy="170" r="100" fill="url(#sticker-grad)" filter="drop-shadow(0 0 25px rgba(56, 189, 248, 0.4))" />
      <path d="M 160 140 L 195 200 L 230 140 Z" fill="#ffffff" />
      <circle cx="195" cy="140" r="14" fill="#ffffff" />
    </g>
  </g>
</svg>
